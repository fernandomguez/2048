<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="2048">
  <title>2048</title>
  <!-- Icono "maskable" (SEPARADO del any: web.dev desaconseja combinarlos).
       Fondo a sangre y todo el contenido dentro del círculo central del 40 %
       del icono (radio 205 px sobre 512): el 10 % exterior puede recortarse. -->
  <defs>
    <linearGradient id="ficha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#14171c"/>
  <rect x="112" y="112" width="288" height="288" rx="44" fill="url(#ficha)"/>
  <text x="256" y="258" font-family="Verdana, Arial, Helvetica, sans-serif" font-size="84" font-weight="700" text-anchor="middle" dominant-baseline="central" fill="#241400">2048</text>
</svg>
