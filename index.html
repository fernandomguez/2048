<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>2048</h1>
        <p class="tagline">Une fichas iguales. Sube la temperatura.</p>
      </div>
      <div class="panel">
        <div class="score-box">
          <span class="score-label">Puntos</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Récord</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="actions">
      <button class="btn" id="new-game">Nueva partida</button>
      <p class="hint">Flechas en escritorio · desliza en móvil</p>
    </div>

    <div class="board-wrap">
      <div id="board" class="board"></div>

      <!-- Overlay de fin de partida / victoria (oculto por defecto) -->
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h2 class="overlay-title" id="overlay-title">Fin</h2>
          <p class="overlay-text" id="overlay-text"></p>
          <div class="overlay-actions" id="overlay-actions"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
