<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <h1>2048</h1>
        <p class="tagline">Une fichas iguales. Sube la temperatura.</p>
      </div>
      <div class="panel">
        <div class="score-box">
          <span class="score-label">Puntos</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">Récord</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <div class="actions">
      <button class="btn" id="new-game">Nueva partida</button>

      <button class="btn ghost icon-btn" id="undo" aria-label="Deshacer" title="Deshacer último movimiento">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 14 4 9l5-5"/>
          <path d="M4 9h11a5 5 0 0 1 0 10h-1"/>
        </svg>
        <span class="count" id="undo-count">3</span>
      </button>

      <button class="btn ghost icon-btn" id="bomb" aria-label="Bomba" title="Eliminar una ficha">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="10.5" cy="14.5" r="6.5"/>
          <path d="M15 10l2.5-2.5"/>
          <path d="M17.5 7.5l1.6-.5M19.1 7l.5-1.6M19.6 5.4l1.6-.5"/>
        </svg>
        <span class="count" id="bomb-count">1</span>
      </button>
    </div>
    <p class="hint">Flechas en escritorio &middot; desliza en m&oacute;vil &middot; usa los power-ups con cabeza</p>

    <div class="board-wrap">
      <div id="board" class="board"></div>

      <!-- Overlay de fin de partida / victoria (oculto por defecto) -->
      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h2 class="overlay-title" id="overlay-title">Fin</h2>
          <p class="overlay-text" id="overlay-text"></p>
          <div class="overlay-actions" id="overlay-actions"></div>
        </div>
      </div>
    </div>
  </main>

  <script src="game.js"></script>
</body>
</html>
